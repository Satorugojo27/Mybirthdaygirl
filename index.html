<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <meta name="color-scheme" content="dark">
  <title>For Parthona</title>
  <meta name="description" content="A small universe, made for Parthona's 19th birthday.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts load from Google Fonts; every font has a solid fallback if offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <noscript>
    <p class="noscript">This little universe needs JavaScript to open. Please turn it on and reload.</p>
  </noscript>

  <!-- The living sky (canvas). A CSS gradient takes over if canvas is unavailable. -->
  <canvas id="cosmos" aria-hidden="true"></canvas>

  <div class="progress" id="progress" role="presentation"><i></i></div>

  <!-- Music controls -->
  <div class="music" id="music">
    <div class="music-bar" role="group" aria-label="Music controls">
      <button class="icon-btn" id="musicToggle" type="button" aria-label="Play music">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="icon-btn" id="musicMute" type="button" aria-label="Mute music" aria-pressed="false">
        <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="musicPanelBtn" type="button" aria-label="Show or hide the music player" aria-expanded="false" aria-controls="musicPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.5l9-2v11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="7" cy="17.5" r="2.3"/><circle cx="16" cy="15.5" r="2.3"/></svg>
      </button>
    </div>
    <div class="music-panel" id="musicPanel">
      <p class="music-title" id="musicTitle">Perfect &mdash; Ed Sheeran</p>
      <div class="yt-wrap"><div id="ytPlayer"></div></div>
      <a class="music-link" id="musicFallback" href="https://www.youtube.com/watch?v=2Vv-BfVoq4g" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
    </div>
  </div>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <main id="app">

    <!-- 1 · THE CAKE ------------------------------------------------>
    <section class="scene" id="scene-cake" data-nav="none" data-sx=".5" data-sy=".2" data-size=".8" data-glow=".25" data-zoom="1" data-dim=".9" aria-labelledby="cake-title" tabindex="-1">
      <div class="room" aria-hidden="true"><div class="room-veil" id="roomVeil"></div><div class="room-warm" id="roomWarm"></div></div>
      <div class="stack cake-head">
        <p class="kicker rise" id="cakeKicker" style="--d:.3s"></p>
        <h1 class="title rise" id="cake-title" style="--d:.7s"></h1>
      </div>
      <div class="cake-stage" id="cakeStage">
        <div class="cake-light" aria-hidden="true"></div>
        <div class="cake-svg" id="cakeSvg"></div>
        <button class="cake-letter" id="cakeLetter" type="button" hidden>
          <span class="cl-paper"><span class="cl-line"></span><span class="cl-line short"></span><span class="cl-seal" aria-hidden="true"></span></span>
          <span class="cl-label" id="cakeLetterLabel"></span>
        </button>
      </div>
      <div class="cake-foot">
        <p class="hint" id="cakeHint" aria-live="polite"></p>
        <button class="btn" id="blowAll" type="button"></button>
        <p class="tiny" id="cakeSound"></p>
      </div>
    </section>

    <!-- 2 · THE LETTER --------------------------------------------->
    <section class="scene" id="scene-letter" data-nav="next" data-sx=".5" data-sy=".16" data-size=".8" data-glow=".4" data-zoom="1" aria-labelledby="letter-title" tabindex="-1">
      <article class="paper" id="paper" tabindex="0" aria-label="A letter for Parthona">
        <h2 class="script" id="letter-title"></h2>
        <div class="paper-body" id="paperBody"></div>
        <p class="paper-close" id="paperClose"></p>
        <p class="paper-sign script" id="paperSign"></p>
      </article>
      <p class="tiny rise" id="letterHint" style="--d:1s"></p>
    </section>

    <!-- 3 · FINDING HER STAR ---------------------------------------->
    <section class="scene" id="scene-intro" data-nav="next" data-sx=".5" data-sy=".3" data-size="1" data-glow=".15" data-zoom="1" aria-labelledby="intro-l1" tabindex="-1">
      <button class="star-hit" id="starHit" type="button"></button>
      <div class="stack intro-lines">
        <p class="lede rise" id="intro-l1" style="--d:.8s"></p>
        <p class="lede rise" id="intro-l2" style="--d:3.6s"></p>
        <p class="lede rise strong" id="intro-l3" style="--d:6.4s"></p>
        <p class="tiny" id="introHint" aria-live="polite"></p>
      </div>
    </section>

    <!-- 4 · THE NINETEEN NOTES --------------------------------------->
    <section class="scene" id="scene-notes" data-nav="full" data-sx=".5" data-sy=".12" data-size=".8" data-glow=".5" data-zoom="1.18" aria-labelledby="notes-title" tabindex="-1">
      <div class="stack notes-head">
        <h2 class="title rise" id="notes-title" style="--d:.2s"></h2>
        <p class="lede small rise" id="notesLede" style="--d:.6s"></p>
      </div>
      <div class="galaxy rise" id="galaxy" role="group" style="--d:.9s"></div>
      <div class="note-card rise" id="noteCard" style="--d:1.2s">
        <p class="note-count" id="noteCount"></p>
        <p class="note-text" id="noteText" aria-live="polite"></p>
      </div>
      <button class="link" id="notesSkip" type="button"></button>
    </section>

    <!-- 5 · NINETEEN ------------------------------------------------>
    <section class="scene" id="scene-birthday" data-nav="full" data-sx=".5" data-sy=".14" data-size="1.1" data-glow=".9" data-zoom="1.3" aria-labelledby="birthday-title" tabindex="-1">
      <div class="sky" id="sky" aria-hidden="true"></div>
      <div class="nineteen rise" aria-hidden="true" style="--d:.2s">
        <div class="orbit" id="orbit"></div>
        <span class="num">19</span>
      </div>
      <div class="stack">
        <h2 class="title rise" id="birthday-title" style="--d:1.2s"></h2>
        <p class="lede small rise" id="birthdayText" style="--d:1.8s"></p>
        <ul class="wishes" id="wishes"></ul>
        <p class="tiny rise" id="birthdayHint" style="--d:4.8s"></p>
      </div>
    </section>

    <!-- 6 · THE PROMISE --------------------------------------------->
    <section class="scene" id="scene-promise" data-nav="back" data-sx=".5" data-sy=".12" data-size="1.2" data-glow=".9" data-zoom="1.38" aria-labelledby="promise-title" tabindex="-1">
      <div class="stack">
        <h2 class="title rise" id="promise-title" style="--d:.2s"></h2>
        <ul class="vows" id="vows"></ul>
        <button class="seal" id="seal" type="button">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-bg" cx="50" cy="50" r="44"/>
            <circle class="ring" id="sealRing" cx="50" cy="50" r="44" pathLength="100"/>
            <path class="spark" d="M50 24 L55 45 L76 50 L55 55 L50 76 L45 55 L24 50 L45 45 Z"/>
          </svg>
        </button>
        <p class="tiny" id="sealHint" aria-live="polite"></p>
        <button class="link" id="sealSkip" type="button"></button>
      </div>
    </section>

    <!-- 7 · FINALE -------------------------------------------------->
    <section class="scene" id="scene-finale" data-nav="back" data-sx=".5" data-sy=".4" data-size="1.5" data-glow="1.3" data-zoom="1.1" aria-labelledby="finale-name" tabindex="-1">
      <div class="heart-photo" id="heartPhoto">
        <img id="heartImg" alt="Parthona" decoding="async">
        <svg class="heart-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="heartOutline"/></svg>
      </div>
      <div class="stack finale-text">
        <p class="kicker rise" id="finaleKicker" style="--d:6.2s"></p>
        <h2 class="name rise" id="finale-name" style="--d:6.6s"></h2>
        <p class="lede small rise" id="finaleText" style="--d:7.4s"></p>
        <p class="script sign rise" id="finaleSign" style="--d:8.4s"></p>
        <button class="btn primary rise" id="replayBtn" type="button" style="--d:9.2s"></button>
      </div>
    </section>

  </main>

  <!-- Bottom navigation -->
  <nav class="nav is-hidden" id="nav" aria-label="Story navigation">
    <button class="btn ghost" id="navBack" type="button">Back</button>
    <button class="btn primary" id="navNext" type="button">Continue</button>
  </nav>

  <!-- Heart-shaped clip for the final photo (path is filled in by JS) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox"><path id="heartClipPath"/></clipPath>
  </svg>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/cosmos.js"></script>
  <script src="js/cake.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
